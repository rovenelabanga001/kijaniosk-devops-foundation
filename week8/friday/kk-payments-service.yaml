apiVersion: v1
kind: Service
metadata:
  name: kk-payments-service
  labels:
    app: kk-payments
spec:
  type: NodePort
  selector:
    app: kk-payments      # Must match the Deployment's Pod template labels exactly
  ports:
  - name: http
    protocol: TCP
    port: 3001            # Port the Service listens on inside the cluster
    targetPort: 3000      # Port the container actually listens on (from Dockerfile EXPOSE)
    nodePort: 30001       # Port exposed on the Minikube node for external access